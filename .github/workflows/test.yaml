name: Test Project #to RUN UNIT TEST IN NODE JS PROJECT
on: workflow_dispatch
jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Nodejs #we are doing this for practice but runner comes with preinstalled software
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install Dependencies 
        run: npm ci

      - name: Run test 
        run: npm test
